apiVersion: v1
kind: ConfigMap
metadata:
  name: env
data:
  APP_COLOR: blue
  tree: trunk
---
apiVersion: v1
kind: Pod
metadata:
  name: colors_pod
spec:
  containers:
  - name: colors-kubeplay
    image: docker.io/library/httpd:2.4-alpine
    ports:
    - containerPort: 80
      hostPort: 7080
    envFrom:
    - configMapRef:
        name: env
        optional: false
