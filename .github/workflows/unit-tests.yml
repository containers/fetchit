name: Unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    env:
      CGO_ENABLED: '1'
      BUILDTAGS: containers_image_openpgp gssapi providerless netgo osusergo exclude_graphdriver_btrfs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgpgme-dev libdevmapper-dev libseccomp-dev pkg-config
      - name: Install SOPS test tools
        run: |
          sudo apt-get install -y age
          sudo bash scripts/install-sops.sh amd64 /usr/local/bin/sops
      - name: Vet
        run: go vet -mod=readonly -tags "$BUILDTAGS" ./cmd/... ./pkg/...
      - name: Test
        env:
          SOPS_TEST_BINARY: /usr/local/bin/sops
          AGE_TEST_BINARY: /usr/bin/age-keygen
        run: go test -mod=readonly -tags "$BUILDTAGS" ./...
      - name: Engine concurrency race checks
        run: go test -race -mod=readonly -tags "$BUILDTAGS" ./pkg/engine -run 'TestStatus|TestMirror|TestCommonGit|TestHelperContainer|TestRetirement|TestConfigReloadCan|TestRollback|TestDisconnected|TestFileTransfer|TestShutdown'

  fedora:
    runs-on: ubuntu-26.04
    container: quay.io/fedora/fedora:44
    env:
      CGO_ENABLED: '1'
      BUILDTAGS: containers_image_openpgp gssapi providerless netgo osusergo exclude_graphdriver_btrfs
    steps:
      - name: Install build dependencies
        run: dnf install -y git tar gzip gcc make pkgconf-pkg-config gpgme-devel device-mapper-devel libseccomp-devel age curl
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install SOPS test binary
        run: bash scripts/install-sops.sh amd64 /usr/local/bin/sops
      - name: Vet
        run: go vet -mod=readonly -tags "$BUILDTAGS" ./cmd/... ./pkg/...
      - name: Test
        env:
          SOPS_TEST_BINARY: /usr/local/bin/sops
          AGE_TEST_BINARY: /usr/bin/age-keygen
        run: go test -mod=readonly -tags "$BUILDTAGS" ./...
